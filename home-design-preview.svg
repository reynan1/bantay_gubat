<text x="700" y="675" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#087f5b">CURRENT ENVIRONMENTAL PROBLEM</text><text x="700" y="716" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#18372d">Rapid forest cover decline</text><text x="700" y="750" font-family="Arial,sans-serif" font-size="13" fill="#617168">The Sierra Madre spans close to 1.4 million hectares. Reported</text><text x="700" y="771" font-family="Arial,sans-serif" font-size="13" fill="#617168">forest loss reflects pressures including logging, land conversion,</text><text x="700" y="792" font-family="Arial,sans-serif" font-size="13" fill="#617168">mining, roads, and other development.</text>
<line x1="700" y1="815" x2="1310" y2="815" stroke="#e1e8df"/><text x="700" y="842" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#89948a">REPORTED ESTIMATE</text><text x="700" y="874" font-family="Georgia,serif" font-size="26" font-weight="700" fill="#174b3c">~9,000 hectares</text><text x="917" y="872" font-family="Arial,sans-serif" font-size="12" fill="#67736a">lost each year · Haribon, via Philstar</text><text x="700" y="897" font-family="Arial,sans-serif" font-size="10" fill="#087f5b">Read the source report ↗</text>
