<!-- text -->
<text x="514" y="87" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#087f5b">A CONNECTED FOREST LANDSCAPE</text>
<text x="514" y="133" font-family="Georgia,serif" font-size="35" font-weight="700" fill="#193a2f">A forest’s effects reach far</text>
<text x="514" y="174" font-family="Georgia,serif" font-size="35" font-weight="700" fill="#193a2f">beyond the trees.</text>
<text x="514" y="214" font-family="Arial,sans-serif" font-size="14" fill="#56685d">Stretching about 540 kilometers along eastern Luzon, the Sierra Madre</text>
<text x="514" y="237" font-family="Arial,sans-serif" font-size="14" fill="#56685d">connects forests, watersheds, wildlife, and communities. Forest loss can</text>
<text x="514" y="260" font-family="Arial,sans-serif" font-size="14" fill="#56685d">put water, livelihoods, biodiversity, and climate resilience under pressure.</text>
