<line x1="123" y1="854" x2="1312" y2="854" stroke="#e5ebe3"/>
<rect x="123" y="873" width="555" height="99" rx="8" fill="#f3f6ef"/><text x="143" y="897" font-family="Arial" font-size="8" font-weight="700" letter-spacing="1" fill="#087f5b">WHY IT MATTERS</text><text x="143" y="921" font-family="Arial" font-size="10" fill="#53645a">Sierra Madre forests shelter native and endemic species. Logging, land clearing, and</text><text x="143" y="939" font-family="Arial" font-size="10" fill="#53645a">fragmentation can reduce nesting sites, food, cover, and movement between habitats.</text><text x="143" y="959" font-family="Arial" font-size="9" font-weight="700" fill="#087f5b">See the full explanation ↓</text>
<text x="711" y="897" font-family="Arial" font-size="8" font-weight="700" letter-spacing="1" fill="#7a887e">SUPPORTING SOURCES</text><text x="711" y="921" font-family="Arial" font-size="10" font-weight="700" fill="#315545">Illegal Logging in the Northern Sierra Madre Natural Park</text><text x="711" y="938" font-family="Arial" font-size="9" fill="#6b786f">van der Ploeg et al. · Conservation &amp; Society (2011)</text><text x="711" y="960" font-family="Arial" font-size="9" font-weight="700" fill="#087f5b">Open reference 4 ↗　　Open reference 6 ↗</text>
